[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openplz-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for German postal data (OpenPLZ API) — localities, streets, municipalities, districts & federal states"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
openplz-mcp = "openplz_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openplz_mcp"]
